[tool.uv.workspace]
members = [
  "AppleMCPCommon",
  "Apple-Tools-MCP",
  "Apple-Calendar-MCP",
  "AppleContacts-MCP",
  "AppleFiles-MCP",
  "AppleMail-MCP",
  "AppleMaps-MCP",
  "AppleMessages-MCP",
  "AppleNotes-MCP",
  "AppleReminders-MCP",
  "AppleShortcuts-MCP",
  "AppleSystem-MCP",
]

[tool.pytest.ini_options]
# Package test suites reuse module names (test_tools.py, ...); importlib mode
# lets `uv run pytest */tests` collect every package in one run.
addopts = "--import-mode=importlib"
