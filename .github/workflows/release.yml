name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    # macOS runner: wheels are pure-Python, but .mcpb bundles target macOS
    # and scripts/build_mcpb.sh may rely on macOS tooling.
    name: Build distributions and bundles
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # No cache here: these artifacts are published, so they are built
          # from the lockfile alone and never from a cache another run wrote.
          enable-cache: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # Like uv above: published artifacts are never built from a cache.
          package-manager-cache: false

      - name: Verify tag and source versions
        run: python3 scripts/check_release.py --tag "$GITHUB_REF_NAME"

      - name: Build sdists and wheels for all packages
        run: uv build --all-packages

      - name: Build .mcpb bundles
        run: bash scripts/build_mcpb.sh

      - name: Verify built assets and generate release metadata
        run: python3 scripts/check_release.py --tag "$GITHUB_REF_NAME" --artifacts

      - name: Verify isolated bundle launches
        run: |
          uv sync --all-packages --locked
          uv run --no-sync python scripts/bundle_smoke.py

      - name: Collect release assets and write SHA256SUMS
        run: |
          mkdir -p release-assets
          cp dist/mcpb/*.mcpb release-assets/
          cp dist/*.tar.gz dist/*.whl release-assets/
          cp release-metadata/*.server.json release-assets/
          (cd release-assets && shasum -a 256 -- * > SHA256SUMS.tmp && mv SHA256SUMS.tmp SHA256SUMS)
          ls -la release-assets
          cat release-assets/SHA256SUMS

      - name: Upload dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Upload release assets artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  publish-common:
    name: Publish apple-mcp-common to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi-apple-mcp-common
      url: https://pypi.org/project/apple-mcp-common/
    permissions:
      id-token: write

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Stage apple-mcp-common distributions
        run: |
          mkdir -p staged
          cp dist/apple_mcp_common-*.tar.gz dist/apple_mcp_common-*.whl staged/
          ls -la staged

      - name: Publish via trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: staged
          skip-existing: true

  publish-domains:
    # Each package keeps its own GitHub environment because PyPI's pending
    # trusted publishers require a unique repo, workflow, and environment.
    name: Publish ${{ matrix.package }} to PyPI
    needs: publish-common
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package:
          - apple-calendar-mcp
          - apple-contacts-mcp
          - apple-files-mcp
          - apple-mcp-mail
          - apple-maps-mcp
          - apple-messages-mcp
          - apple-mcp-notes
          - apple-mcp-reminders
          - apple-shortcuts-mcp
          - apple-system-mcp
    environment:
      name: pypi-${{ matrix.package }}
      url: https://pypi.org/project/${{ matrix.package }}/
    permissions:
      id-token: write

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Stage this package's distributions
        run: |
          module_name="$(echo '${{ matrix.package }}' | tr '-' '_')"
          mkdir -p staged
          cp "dist/${module_name}-"*.tar.gz "dist/${module_name}-"*.whl staged/
          ls -la staged

      - name: Publish via trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: staged
          skip-existing: true

  publish-unified:
    name: Publish apple-tools-mcp to PyPI
    needs: publish-domains
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi-apple-tools-mcp
      url: https://pypi.org/project/apple-tools-mcp/
    permissions:
      id-token: write

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Stage apple-tools-mcp distributions
        run: |
          mkdir -p staged
          cp dist/apple_tools_mcp-*.tar.gz dist/apple_tools_mcp-*.whl staged/
          ls -la staged

      - name: Publish via trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: staged
          skip-existing: true

  github-release:
    name: Create GitHub Release
    needs: publish-unified
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download release assets artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets/

      - name: Create release and attach assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: release-assets/*
          generate_release_notes: true

  publish-registry:
    name: Publish servers to MCP Registry
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download exact release metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets/

      - name: Install verified mcp-publisher v1.8.9
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          expected_sha256="4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8"
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/$archive" \
            --output "$archive"
          echo "$expected_sha256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" mcp-publisher
          chmod +x mcp-publisher

      - name: Validate all registry records
        run: |
          shopt -s nullglob
          metadata=(release-assets/*.server.json)
          if [ "${#metadata[@]}" -ne 11 ]; then
            echo "Expected 11 generated server.json files, found ${#metadata[@]}" >&2
            exit 1
          fi
          for server_json in "${metadata[@]}"; do
            ./mcp-publisher validate "$server_json"
          done

      - name: Authenticate to MCP Registry with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish all registry records sequentially
        run: |
          for server_json in release-assets/*.server.json; do
            ./mcp-publisher publish "$server_json"
          done
