[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-tools-mcp"
version = "1.0.2"
description = "Unified Apple ecosystem MCP server for macOS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
  { name = "Jonathan R. Reed" },
]
keywords = ["mcp", "model-context-protocol", "macos", "apple", "ai-agent", "automation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: MacOS X",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "apple-mcp-common>=1.0.0,<2",
  "apple-calendar-mcp>=1.0.0,<2",
  "apple-contacts-mcp>=1.0.0,<2",
  "apple-files-mcp>=1.0.0,<2",
  "apple-mcp-mail>=1.0.0,<2",
  "apple-maps-mcp>=1.0.0,<2",
  "apple-messages-mcp>=1.0.0,<2",
  "apple-mcp-notes>=1.0.0,<2",
  "apple-mcp-reminders>=1.0.0,<2",
  "apple-shortcuts-mcp>=1.0.0,<2",
  "apple-system-mcp>=1.0.0,<2",
  "mcp>=2.0.0,<3",
  "pydantic>=2.12.0",
]

[project.urls]
Homepage = "https://github.com/JonathanRReed/Apple-MCPs"
Documentation = "https://github.com/JonathanRReed/Apple-MCPs/tree/main/docs"
Portfolio = "https://jonathanrreed.com/projects/apple-mcps/"
Author = "https://jonathanrreed.com/about/"
Repository = "https://github.com/JonathanRReed/Apple-MCPs"
Changelog = "https://github.com/JonathanRReed/Apple-MCPs/blob/main/CHANGELOG.md"
Issues = "https://github.com/JonathanRReed/Apple-MCPs/issues"

[project.scripts]
apple-tools-mcp = "apple_agent_mcp.tools:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
apple-mcp-common = { workspace = true }
apple-calendar-mcp = { workspace = true }
apple-contacts-mcp = { workspace = true }
apple-files-mcp = { workspace = true }
apple-mcp-mail = { workspace = true }
apple-maps-mcp = { workspace = true }
apple-messages-mcp = { workspace = true }
apple-mcp-notes = { workspace = true }
apple-mcp-reminders = { workspace = true }
apple-shortcuts-mcp = { workspace = true }
apple-system-mcp = { workspace = true }
