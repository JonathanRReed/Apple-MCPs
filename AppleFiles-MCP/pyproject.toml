[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-files-mcp"
version = "1.0.0"
description = "Local Apple Files MCP server for macOS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "apple-mcp-common>=1.0.0,<2",
  "mcp>=2.0.0,<3",
  "pydantic>=2.12.0",
]

[project.scripts]
apple-files-mcp = "apple_files_mcp.tools:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
